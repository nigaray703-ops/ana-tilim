<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ULY 方案 1 视觉对比</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        color: #162657;
        background: #eef3ef;
        font-family: Arial, sans-serif;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 22px;
      }

      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        align-items: start;
      }

      figure {
        margin: 0;
        padding: 14px;
        border: 1px solid #dfe3eb;
        border-radius: 14px;
        background: #fff;
      }

      figcaption {
        margin-bottom: 10px;
        font-size: 14px;
        font-weight: 700;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h1>ULY 方案 1：源视觉与桌面实现</h1>
    <main>
      <figure>
        <figcaption>源视觉方案</figcaption>
        <img src="./source-option-1.png" alt="用户选定的 ULY 方案 1" />
      </figure>
      <figure>
        <figcaption>浏览器实现（952 × 908，DPR 1）</figcaption>
        <img src="./desktop-aa-option-1-952x908.jpg" alt="Ana Tilim 字母例词实现" />
      </figure>
    </main>
  </body>
</html>
